name: Deploy website

# Publishes site/ (landing page) + demo/ (store and test page) to GitHub Pages.
# Custom domain: https://agentready.gh.miniasp.com/ (site/CNAME)
#   /            → site/index.html
#   /demo/store/ → demo/store/ (bundle refreshed from a clean build)

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'demo/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Assemble static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install

      - name: Build bundle (refreshes demo/store/vendor/agentready.js)
        run: bun run build

      - name: Assemble _site
        run: |
          rm -rf _site
          mkdir -p _site/demo
          cp -R site/. _site/
          cp -R demo/store _site/demo/store
          cp -R demo/test-page _site/demo/test-page
          rm -f _site/demo/store/netlify.toml
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
